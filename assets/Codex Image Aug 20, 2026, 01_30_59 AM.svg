<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 580" role="img" aria-labelledby="title desc">
  <title id="title">Mayank Suthar — developer and builder</title>
  <desc id="desc">A dark futuristic developer profile banner with a glowing abstract city and silhouette.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070B1A"/><stop offset=".5" stop-color="#101338"/><stop offset="1" stop-color="#170A2A"/></linearGradient>
    <radialGradient id="sun"><stop stop-color="#FDE68A"/><stop offset=".28" stop-color="#FB7185"/><stop offset=".65" stop-color="#8B5CF6" stop-opacity=".6"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#FB7185" stop-opacity="0"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#7DD3FC" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1600" height="580" fill="url(#bg)"/><rect width="1600" height="580" fill="url(#grid)"/>
  <circle cx="1260" cy="210" r="255" fill="url(#sun)"/>
  <g opacity=".55" stroke="#67E8F9" fill="none"><path d="M0 450C260 330 370 590 650 430S1120 270 1600 395"/><path d="M0 480C260 360 400 610 700 460S1160 300 1600 425" stroke-opacity=".25"/></g>
  <g fill="#0A1025" stroke="#334155" stroke-width="2"><path d="M865 580V416h42v-105h34v105h30v-155h49v155h26v-78h39v78h31v-120h43v120h25v-175h57v175h24v-91h40v91h40v-145h47v145h42v-210h62v210h30v-82h38v82h48v-138h57v138h52v164z"/></g>
  <g stroke="#7DD3FC" stroke-width="3" opacity=".8"><path d="M1108 328v80M1130 328v80M1330 280v128M1354 280v128M1444 390v18"/></g>
  <g transform="translate(980 242)" fill="none" stroke="#E0E7FF" stroke-width="3"><path d="M0 166c19-86 53-117 91-117s72 31 91 117" fill="#080D20"/><circle cx="91" cy="34" r="34" fill="#141A3B"/><path d="M48 41c15 11 74 11 87-13M23 166h136"/></g>
  <g transform="translate(125 128)"><text fill="#7DD3FC" font-family="monospace" font-size="20" letter-spacing="7">SYSTEM.ONLINE // 2026</text><text y="92" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="82" font-weight="800" letter-spacing="3">MAYANK SUTHAR</text><text y="142" fill="#C4B5FD" font-family="monospace" font-size="25" letter-spacing="4">DEVELOPER · BUILDER · PROBLEM SOLVER</text><path d="M0 180H640" stroke="url(#line)" stroke-width="3" filter="url(#glow)"/><text y="232" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="24">Building useful things, one commit at a time.</text></g>
  <g fill="#67E8F9" filter="url(#glow)"><circle cx="98" cy="91" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle><circle cx="1514" cy="112" r="3"><animate attributeName="opacity" values="1;.2;1" dur="2.8s" repeatCount="indefinite"/></circle><circle cx="754" cy="416" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="1.7s" repeatCount="indefinite"/></circle></g>
</svg>
